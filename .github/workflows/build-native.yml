name: Build Native Installers

# 跨平台原生安装包：打 v* tag 或手动触发。
# 流程：build-jar(ubuntu 出 fat jar) -> package(矩阵三平台各用 jpackage 出原生包) -> release(汇总上传到 tag Release)
# 注意：JavaFX 是自动模块，jpackage 必须用非模块化 classpath 模式（--main-jar + --main-class），否则 jlink 阶段失败。
#       JDK 25 要求 --enable-native-access 放开 javafx.* / jna / sqlite 的 native 访问。
#       macOS/Windows/Linux 的 --app-version 只接受 1~3 段数字（如 1.5.2），不能用 1.5.2.1。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Set up Maven
        uses: stCarolas/setup-maven@v4
        with:
          maven-version: 3.9.9
      - name: Install local mvvmfx into runner local repo (不在公共仓库，且会被 settings 镜像绕过)
        run: mvn install:install-file -Dfile=libs/de/saxsys/mvvmfx/1.9.0/mvvmfx-1.9.0.jar -DpomFile=libs/de/saxsys/mvvmfx/1.9.0/mvvmfx-1.9.0.pom
      - name: Build fat jar
        run: mvn -B clean package -DskipTests
      - name: Upload fat jar
        uses: actions/upload-artifact@v4
        with:
          name: fat-jar
          path: target/wuthering-waves-tool-1.5.2.1.jar
          retention-days: 1

  package:
    needs: build-jar
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Download fat jar
        uses: actions/download-artifact@v4
        with:
          name: fat-jar
          path: target
      - name: Prepare input (固定名 app.jar)
        shell: bash
        run: |
          mkdir -p build/input
          cp target/wuthering-waves-tool-1.5.2.1.jar build/input/app.jar
          # mvvmfx 已改为普通依赖，由 shade 插件自动打进 fat jar，无需手动加入 classpath
          ls -lh build/input/
      - name: Package Linux (deb)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          mkdir -p dist
          jpackage --type deb \
            --input build/input --main-jar app.jar \
            --main-class cn.tealc.wutheringwavestool.Launcher \
            --name wuthering-wavestool --app-version 1.5.2 \
            --dest dist --vendor qwerwhr --copyright "© 2026 qwerwhr" \
            --icon src/main/resources/cn/tealc/wutheringwavestool/image/icon.png \
            --java-options "-XX:+UseZGC" \
            --java-options "-Djavafx.enablePreview=true" \
            --java-options "--enable-native-access=javafx.base,javafx.controls,javafx.fxml,javafx.graphics,javafx.media,javafx.swing,javafx.web,com.sun.jna,com.sun.jna.platform,org.xerial.sqlitejdbc"
      - name: Package macOS (dmg, 未签名)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          mkdir -p dist
          # 由仓库内的 icon.png 用 macOS 自带 iconutil 生成 icns
          mkdir -p build/icon.iconset
          SRC=src/main/resources/cn/tealc/wutheringwavestool/image/icon.png
          for s in 16 32 64 128 256 512 1024; do
            sips -z $s $s "$SRC" --out build/icon.iconset/icon_${s}x${s}.png 2>/dev/null || true
          done
          sips -z 32 32 "$SRC" --out build/icon.iconset/icon_16x16@2x.png 2>/dev/null || true
          sips -z 64 64 "$SRC" --out build/icon.iconset/icon_32x32@2x.png 2>/dev/null || true
          sips -z 128 128 "$SRC" --out build/icon.iconset/icon_64x64@2x.png 2>/dev/null || true
          sips -z 256 256 "$SRC" --out build/icon.iconset/icon_128x128@2x.png 2>/dev/null || true
          sips -z 512 512 "$SRC" --out build/icon.iconset/icon_256x256@2x.png 2>/dev/null || true
          sips -z 1024 1024 "$SRC" --out build/icon.iconset/icon_512x512@2x.png 2>/dev/null || true
          iconutil --convert icns build/icon.iconset -o build/icon.icns
          jpackage --type dmg \
            --input build/input --main-jar app.jar \
            --main-class cn.tealc.wutheringwavestool.Launcher \
            --name WutheringWavesTool --app-version 1.5.2 \
            --dest dist --vendor qwerwhr --copyright "© 2026 qwerwhr" \
            --icon build/icon.icns \
            --mac-package-identifier cn.tealc.wutheringwavestool \
            --java-options "-XX:+UseZGC" \
            --java-options "-Djavafx.enablePreview=true" \
            --java-options "--enable-native-access=javafx.base,javafx.controls,javafx.fxml,javafx.graphics,javafx.media,javafx.swing,javafx.web,com.sun.jna,com.sun.jna.platform,org.xerial.sqlitejdbc"
      - name: Package Windows (msi 安装程序 + 便携 zip)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          mkdir -p dist
          jpackage --type msi `
            --input build/input --main-jar app.jar `
            --main-class cn.tealc.wutheringwavestool.Launcher `
            --name WutheringWavesTool --app-version 1.5.2 `
            --dest dist --vendor qwerwhr --copyright "© 2026 qwerwhr" `
            --icon src/main/resources/cn/tealc/wutheringwavestool/image/icon.ico `
            --win-shortcut --win-menu --win-dir-chooser --win-menu-group "WutheringWavesTool" `
            --java-options "-XX:+UseZGC" `
            --java-options "-Djavafx.enablePreview=true" `
            --java-options "--enable-native-access=javafx.base,javafx.controls,javafx.fxml,javafx.graphics,javafx.media,javafx.swing,javafx.web,com.sun.jna,com.sun.jna.platform,org.xerial.sqlitejdbc"
          # 便携版（含 exe 启动器，免安装）
          jpackage --type app-image `
            --input build/input --main-jar app.jar `
            --main-class cn.tealc.wutheringwavestool.Launcher `
            --name WutheringWavesTool --app-version 1.5.2 `
            --dest build/appimage `
            --icon src/main/resources/cn/tealc/wutheringwavestool/image/icon.ico `
            --java-options "-XX:+UseZGC" \
            --java-options "-Djavafx.enablePreview=true" \
            --java-options "--enable-native-access=javafx.base,javafx.controls,javafx.fxml,javafx.graphics,javafx.media,javafx.swing,javafx.web,com.sun.jna,com.sun.jna.platform,org.xerial.sqlitejdbc"
          Compress-Archive -Path build/appimage/WutheringWavesTool -DestinationPath "dist/WutheringWavesTool-1.5.2.1-windows-portable.zip"
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: dist/*
          retention-days: 1

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: bundles
      - name: Download fat jar
        uses: actions/download-artifact@v4
        with:
          name: fat-jar
          path: bundles
      - name: List bundles
        run: ls -lhR bundles
      - name: Create / Update Release
        uses: softprops/action-gh-release@v2
        with:
          files: bundles/**
          generate_release_notes: true
          allow_updates: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
